services:
    nginx:
        image: nginx:latest
        container_name: nginx-develop
        ports:
            - "80:80"
        volumes:
            - ./:/var/www/html
            - ./config/nginx.conf:/etc/nginx/conf.d/default.conf
        depends_on:
            - php-fpm
        links:
            - php-fpm

    php-fpm:
        build: ./config/php-fpm
        container_name: php-fpm-develop
        volumes:
            - ./:/var/www/html
        links:
            - db

    db:
        image: mariadb
        container_name: mariadb-develop
        volumes:
            - mysql-data:/var/lib/mysql
        environment:
            MYSQL_ROOT_PASSWORD: scloud
            MYSQL_DATABASE: scloud

volumes:
    mysql-data: